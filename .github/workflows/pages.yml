name: Deploy web2d to GitHub Pages

# Publishes the browser game in web2d/ as the site root, so it's playable at
# https://<owner>.github.io/<repo>/ on any device. Runs on pushes to main that
# touch the game (or this workflow), and can be run manually.
on:
  push:
    branches: [main]
    paths:
      - "web2d/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer deploy supersede an in-flight one, but never cancel a run already
# publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true # turn Pages on automatically on first run
      - name: Upload web2d as the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web2d
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
