<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bossraid — Erika render previews</title>
  <style>
    body { margin: 0; background: #0b0b10; color: #e7ecf5; font-family: system-ui, sans-serif;
           text-align: center; padding: 18px 12px 60px; }
    h1 { font-size: 20px; font-weight: 600; margin: 6px 0 2px; }
    .sub { color: #8a93a6; font-size: 13px; margin-bottom: 18px; }
    .card { background: #15140f; border: 1px solid #2a2c36; border-radius: 14px;
            max-width: 420px; margin: 14px auto; padding: 12px; }
    .card img { width: 100%; max-width: 320px; border-radius: 10px; background: #15140f; image-rendering: auto; }
    .label { font-size: 15px; margin-top: 8px; font-weight: 600; }
    .note { font-size: 12px; color: #8a93a6; margin-top: 2px; }
  </style>
</head>
<body>
  <h1>Erika — 3D → sprite previews</h1>
  <div class="sub">bow fixed: vertical · riser out · string to her · 3⁄4 view · 30fps</div>

  <div class="card">
    <img src="erika_idle.gif?v=5" alt="Erika idle" />
    <div class="label">Idle</div>
    <div class="note">relaxed stance · bow held upright at the ready</div>
  </div>

  <div class="card">
    <img src="erika_walk.gif?v=5" alt="Erika walk" />
    <div class="label">Walk / Move</div>
    <div class="note">bow carried upright · in place</div>
  </div>

  <div class="card">
    <img src="erika_shoot.gif?v=5" alt="Erika shoot" />
    <div class="label">Shoot / Draw</div>
    <div class="note">real bow draw · string pulled by the right hand</div>
  </div>
</body>
</html>
