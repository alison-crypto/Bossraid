<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Bossraid" />
  <meta name="theme-color" content="#06070b" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <title>Bossraid 2D</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      position: fixed; inset: 0;          /* lock the page — nothing scrolls/bounces */
      width: 100%; height: 100%;
      height: 100dvh;                     /* fill the *visible* area under the mobile URL bar */
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;                 /* no pan/zoom gestures anywhere */
      background: #06070b; color: #cfd6e4;
      font-family: system-ui, sans-serif;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    }
    #wrap {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    canvas {
      display: block;
      /* Grow to the largest 1.6-aspect rectangle that fits the *visible*
         viewport — fills the screen/fullscreen without distorting. dvh tracks
         the mobile URL bar so nothing is cut off behind it. */
      width:  min(100vw, calc(100dvh * 1.6));
      height: min(100dvh, calc(100vw / 1.6));
      touch-action: none;
    }
    #fs {
      position: fixed; top: 10px; right: 10px; z-index: 10;
      width: 46px; height: 46px; border-radius: 9px;
      border: 1px solid rgba(180,200,230,.45);
      background: rgba(20,24,34,.62); color: #dfe7f5;
      font-size: 22px; line-height: 1; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      touch-action: manipulation;
    }
    #fs:active { background: rgba(45,54,74,.95); }
  </style>
</head>
<body>
  <div id="wrap"><canvas id="game"></canvas></div>
  <button id="fs" title="Fullscreen" aria-label="Fullscreen">⛶</button>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
