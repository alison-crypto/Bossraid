<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Bossraid 2D</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      position: fixed; inset: 0;          /* lock the page — nothing scrolls/bounces */
      width: 100%; height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;                 /* no pan/zoom gestures anywhere */
      background: #06070b; color: #cfd6e4;
      font-family: system-ui, sans-serif;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    }
    #wrap {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    canvas {
      display: block;
      max-width: 100%; max-height: 100%;  /* fill the screen, letterboxed to aspect */
      aspect-ratio: 1.6;                  /* 960 / 600 */
      touch-action: none;
    }
  </style>
</head>
<body>
  <div id="wrap"><canvas id="game"></canvas></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
