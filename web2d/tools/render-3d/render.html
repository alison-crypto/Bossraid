<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>html, body { margin: 0; background: transparent; } #c { display: block; }</style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="c"></canvas>
  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { FBXLoader } from "three/addons/loaders/FBXLoader.js";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

    const loader = new GLTFLoader();
    const fbxLoader = new FBXLoader();
    const b64ToBuf = (b64) => {
      const bin = atob(b64), len = bin.length, bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
      return bytes.buffer;
    };
    const parseGlb = (b64) => new Promise((res, rej) => loader.parse(b64ToBuf(b64), "", res, rej));

    // Render `frames` evenly-spaced poses of a clip into transparent PNG dataURLs,
    // at a fixed 3/4 top-down camera so they drop straight into the 2.5D game.
    window.renderFrames = async (opts) => {
      const size = opts.size || 1024;
      const canvas = document.getElementById("c");
      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(size, size);
      renderer.setClearColor(0x000000, 0);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;

      const scene = new THREE.Scene();
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture; // lights PBR materials
      scene.add(new THREE.AmbientLight(0xffffff, 0.5));
      const key = new THREE.DirectionalLight(0xfff2e0, 2.4); key.position.set(-4, 7, 5); scene.add(key);
      const rim = new THREE.DirectionalLight(0x88aaff, 0.7); rim.position.set(4, 3, -5); scene.add(rim);

      // character: from FBX (e.g. "Erika Archer With Bow Arrow" — bow built into the
      // rig) or from GLB. FBX path lets us A/B the built-in bow vs our attachment.
      let gltf = null, model;
      if (opts.charFbxB64) { model = fbxLoader.parse(b64ToBuf(opts.charFbxB64), ""); }
      else { gltf = await parseGlb(opts.charB64); model = gltf.scene; }
      scene.add(model);
      // Skinned meshes are frustum-culled by their BIND-pose bounds; root-motion
      // clips push the animated mesh out of that sphere and it vanishes. Disable
      // culling so it always renders.
      model.traverse((o) => { if (o.isMesh || o.isSkinnedMesh) o.frustumCulled = false; });
      // Mixamo clothes meshes often have inverted normals (back-face culled) and a
      // spurious alpha channel that Blender exports as transparent -> the character
      // renders "naked". Force double-sided + opaque so everything shows.
      model.traverse((o) => { if ((o.isMesh || o.isSkinnedMesh) && o.material) { (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => { m.side = THREE.DoubleSide; m.transparent = false; m.alphaTest = 0; m.depthWrite = true; }); } });
      // optional: replace materials with a neutral matte so an FBX char (whose
      // embedded textures may not load -> renders black) is clearly visible. The
      // bow protrudes, so its shape/orientation reads even at one flat colour.
      if (opts.flatMat) model.traverse((o) => { if (o.isMesh || o.isSkinnedMesh) o.material = new THREE.MeshStandardMaterial({ color: 0xc2c7d0, roughness: 0.65, metalness: 0.0 }); });
      // layer rendering for swappable weapons: showOnly renders ONLY meshes whose
      // name matches (e.g. the bow), hide renders everything EXCEPT matches (the
      // body). Same skeleton/clip/camera -> the two layers composite perfectly.
      if (opts.showOnly) { const re = new RegExp(opts.showOnly, "i"); model.traverse((o) => { if (o.isMesh || o.isSkinnedMesh) o.visible = re.test(o.name); }); }
      if (opts.hide) { const re = new RegExp(opts.hide, "i"); model.traverse((o) => { if ((o.isMesh || o.isSkinnedMesh) && re.test(o.name)) o.visible = false; }); }

      // normalize: height -> 1 unit, centered on X/Z, feet at y=0. Fit to the BODY
      // only — weapons/armor (bow, arrow, sword, quiver) must not affect framing,
      // or a held bow inflates the bbox and the body shrinks/shifts off-screen.
      const EXCLUDE_FIT = /bow|arrow|sword|axe|mace|staff|hammer|shield|dagger|weapon|quiver/i;
      const fitBox = () => {
        const b = new THREE.Box3(); let any = false;
        model.updateMatrixWorld(true);
        model.traverse((o) => { if ((o.isMesh || o.isSkinnedMesh) && o.visible && !EXCLUDE_FIT.test(o.name)) { b.expandByObject(o); any = true; } });
        return any ? b : new THREE.Box3().setFromObject(model);
      };
      let box = fitBox();
      const dim = new THREE.Vector3(); box.getSize(dim);
      model.scale.setScalar(1 / (dim.y || 1));
      box = fitBox();
      model.position.x -= (box.min.x + box.max.x) / 2;
      model.position.z -= (box.min.z + box.max.z) / 2;
      model.position.y -= box.min.y;

      // weapons: parent the bow to the left hand and an arrow to the right hand so
      // they ride the animation. Offsets are tuned in ~world units (a grip group
      // cancels the hand bone's tiny world scale so x/y/z/scale read intuitively).
      const attachments = []; // locked weapons get re-pinned/re-oriented each frame
      const findBone = (re) => { let b = null; model.traverse((o) => { if (!b && o.isBone && re.test(o.name)) b = o; }); return b; };
      const attach = async (b64v, boneRe, cfg) => {
        if (!b64v) return;
        const raw = (await parseGlb(b64v)).scene;
        let bb = new THREE.Box3().setFromObject(raw); const bd = new THREE.Vector3(); bb.getSize(bd);
        raw.scale.setScalar(1 / (Math.max(bd.x, bd.y, bd.z) || 1)); // normalize: max dim -> 1 unit
        raw.updateMatrixWorld(true);
        // recenter on the grip (bbox center) so the HAND holds the middle of the
        // bow, not a limb tip / the wrist.
        bb = new THREE.Box3().setFromObject(raw); const ctr = new THREE.Vector3(); bb.getCenter(ctr);
        raw.position.sub(ctr);
        if (cfg.mirror) raw.scale.x *= -1; // flip handedness / recurve direction
        const g = new THREE.Group(); g.add(raw); // holder carries orientation + scale
        const bone = findBone(boneRe); if (!bone) return;
        const r = cfg.rot || [0, 0, 0];
        const euler = new THREE.Euler(r[0] * Math.PI / 180, r[1] * Math.PI / 180, r[2] * Math.PI / 180);
        if (cfg.lock) {
          // Non-bow clips (idle/walk/run) don't pose the wrist for a bow, so the
          // rigidly-parented bow flips sideways. Instead pin it to the hand's
          // POSITION but orient it relative to the HIPS (body facing) + a fixed
          // offset — so "string toward her / riser toward target" stays correct no
          // matter which way the clip faces. Parented to the scene (world transform).
          scene.add(g);
          g.scale.setScalar(cfg.scale ?? 0.6);
          attachments.push({ obj: g, bone, offset: new THREE.Quaternion().setFromEuler(euler), pos: cfg.pos || [0, 0, 0] });
        } else {
          // Bow clips (draw/shoot): rigidly parent to the hand so it rides the draw.
          model.updateMatrixWorld(true);
          const ws = new THREE.Vector3(); bone.getWorldScale(ws);
          const grip = new THREE.Group(); grip.scale.setScalar(1 / (ws.x || 1)); bone.add(grip); grip.add(g);
          g.scale.setScalar(cfg.scale ?? 0.9);
          const p = cfg.pos || [0, 0, 0]; g.position.set(p[0], p[1], p[2]);
          g.rotation.copy(euler);
        }
      };
      await attach(opts.bowB64, /LeftHand$/i, opts.bow || {});
      await attach(opts.arrowB64, /RightHand$/i, opts.arrowCfg || {});

      // hip anchor — keep the character planted so it doesn't bob/drift ("jump")
      let anchor = null;
      model.traverse((o) => { if (!anchor && o.isBone && /hip|pelvis|root/i.test(o.name)) anchor = o; });
      if (!anchor) model.traverse((o) => { if (!anchor && o.isBone && /spine/i.test(o.name)) anchor = o; });
      const ground = opts.ground !== false;
      let aX = 0, aY = 0, aZ = 0;

      // clip: prefer a Mixamo FBX (loaded directly — no glb conversion needed),
      // then an external anim glb, else an embedded clip
      let clip = null;
      if (opts.animFbxB64) {
        const f = fbxLoader.parse(b64ToBuf(opts.animFbxB64), "");
        clip = f.animations[0];
        // Mixamo FBX is in centimetres; our Erika.glb skeleton is in metres, so the
        // translation tracks (esp. hips) are ~100x too big and throw the model off
        // screen. Scale .position tracks down to match.
        const ps = opts.fbxPosScale ?? 0.01;
        for (const t of clip.tracks) if (/\.position$/.test(t.name)) for (let i = 0; i < t.values.length; i++) t.values[i] *= ps;
      }
      else if (opts.animB64) { const a = await parseGlb(opts.animB64); clip = a.animations[0]; }
      else if (gltf?.animations?.length) clip = opts.clipName ? gltf.animations.find((c) => c.name === opts.clipName) : gltf.animations[0];
      const mixer = clip ? new THREE.AnimationMixer(model) : null;
      let duration = 0;
      if (mixer && clip) { mixer.clipAction(clip).play(); duration = clip.duration; }

      // camera — 3/4 view, pitched down ~`pitch`°, yaw `yaw`°
      const cam = new THREE.PerspectiveCamera(opts.cam?.fov ?? 26, 1, 0.01, 100);
      const pitch = (opts.cam?.pitch ?? 30) * Math.PI / 180;
      const yaw = (opts.cam?.yaw ?? 18) * Math.PI / 180;
      const dist = opts.cam?.dist ?? 3.3;
      const tgtY = opts.cam?.targetY ?? 0.52;
      cam.position.set(Math.sin(yaw) * Math.cos(pitch) * dist, tgtY + Math.sin(pitch) * dist, Math.cos(yaw) * Math.cos(pitch) * dist);
      cam.lookAt(0, tgtY, 0);

      // frame count: explicit `frames`, else sample at `fps` across the clip
      // (so fast actions get few frames, loops get more), capped by `maxFrames`.
      let frames = opts.frames || 24;
      if (opts.fps && duration > 0) frames = Math.min(opts.maxFrames || 999, Math.max(2, Math.round(duration * opts.fps)));
      const out = [];
      const v = new THREE.Vector3();
      for (let i = 0; i < frames; i++) {
        const t = duration * (opts.loop ? i / frames : (frames > 1 ? i / (frames - 1) : 0));
        if (mixer) mixer.setTime(t);
        if (ground && anchor) {
          model.updateMatrixWorld(true);
          anchor.getWorldPosition(v);
          if (i === 0) { aX = v.x; aY = v.y; aZ = v.z; }
          model.position.x += aX - v.x;
          model.position.y += aY - v.y;
          model.position.z += aZ - v.z; // cancel forward root motion (run in place)
          model.updateMatrixWorld(true);
        }
        if (attachments.length) {
          model.updateMatrixWorld(true);
          const hq = new THREE.Quaternion();
          if (anchor) anchor.getWorldQuaternion(hq); // body facing
          for (const at of attachments) {
            at.bone.getWorldPosition(v);
            at.obj.position.set(v.x + at.pos[0], v.y + at.pos[1], v.z + at.pos[2]);
            at.obj.quaternion.copy(hq).multiply(at.offset);
          }
        }
        renderer.render(scene, cam);
        out.push(canvas.toDataURL("image/png"));
      }
      renderer.dispose();
      return { frames: out, duration };
    };

    // Inspect a character FBX: find bow/arrow nodes, report their parent bone and
    // local transform so we can replicate the rig's exact bow attachment.
    window.inspectChar = async (b64) => {
      const root = fbxLoader.parse(b64ToBuf(b64), "");
      const hits = [];
      root.traverse((o) => {
        if (/bow|arrow|weapon|quiver/i.test(o.name) && !o.isBone) {
          const p = o.position, q = o.quaternion, s = o.scale;
          hits.push({
            name: o.name, type: o.type, parent: o.parent?.name || null, parentType: o.parent?.type || null,
            pos: [p.x, p.y, p.z], quat: [q.x, q.y, q.z, q.w], scale: [s.x, s.y, s.z],
          });
        }
      });
      const bones = [];
      root.traverse((o) => { if (o.isBone && /hand|weapon|prop/i.test(o.name)) bones.push(o.name); });
      // compute the bow's bind-pose transform RELATIVE TO the left-hand bone, so we
      // can rigidly attach our swappable bow there and have it track the hand like
      // the skinned reference does.
      root.updateMatrixWorld(true);
      let hand = null, bow = null;
      root.traverse((o) => { if (o.isBone && /LeftHand$/i.test(o.name)) hand = hand || o; });
      root.traverse((o) => { if (/bow/i.test(o.name) && (o.isMesh || o.isSkinnedMesh)) bow = bow || o; });
      let rel = null;
      if (hand && bow) {
        const bb = new THREE.Box3().setFromObject(bow);
        const c = new THREE.Vector3(); bb.getCenter(c);
        const size = new THREE.Vector3(); bb.getSize(size);
        const handPos = new THREE.Vector3(), handQ = new THREE.Quaternion(), handS = new THREE.Vector3();
        hand.matrixWorld.decompose(handPos, handQ, handS);
        const inv = new THREE.Matrix4().copy(hand.matrixWorld).invert();
        const localC = c.clone().applyMatrix4(inv);
        rel = { handBone: hand.name, bowWorldCenter: [c.x, c.y, c.z], bowWorldSize: [size.x, size.y, size.z],
          handWorldScale: [handS.x, handS.y, handS.z], bowCenterInHandLocal: [localC.x, localC.y, localC.z] };
      }
      const allMeshes = [];
      root.traverse((o) => { if (o.isMesh || o.isSkinnedMesh) allMeshes.push({ name: o.name, type: o.type, visible: o.visible }); });
      return { hits, handBones: [...new Set(bones)], rel, allMeshes };
    };

    window.__ready = true;
  </script>
</body>
</html>
